[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-library"
version = "0.2.0"
description = "Native dataframe intake and physical-schema discovery for a data-quality profiler"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Jek n Jok" }]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
polars = ["polars>=1.0"]
pyspark = ["pyspark>=3.4"]
all-backends = ["pandas>=2.2", "polars>=1.0", "pyspark>=3.4"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["data_quality"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["data_quality"]
